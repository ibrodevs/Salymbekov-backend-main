name: Backend checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  django-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Django system check
        run: python manage.py check

      - name: Check model migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Bootstrap CMS routes
        run: python manage.py bootstrap_site_pages

      - name: Safely fill empty CMS pages
        run: python manage.py fill_empty_cms_from_snapshots

      - name: Initialize homepage CMS
        run: python manage.py seed_home_page

      - name: Audit CMS content
        run: python manage.py audit_existing_cms_content --only-problems
