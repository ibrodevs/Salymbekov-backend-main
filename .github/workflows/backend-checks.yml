name: Backend checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  django-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Django system check
        run: python manage.py check

      - name: Check production S3 settings
        env:
          DJANGO_SETTINGS_MODULE: core.production_settings
          BUCKETEER_AWS_ACCESS_KEY_ID: test-access-key
          BUCKETEER_AWS_SECRET_ACCESS_KEY: test-secret-key
          BUCKETEER_AWS_REGION: us-east-1
          BUCKETEER_BUCKET_NAME: salymbekov-ci-test
        run: |
          python - <<'PY'
          import django
          django.setup()
          from django.conf import settings
          from django.core.files.storage import default_storage

          assert "storages.backends.s3" in default_storage.__class__.__module__
          assert default_storage.location == "public"
          assert settings.MEDIA_URL == "https://salymbekov-ci-test.s3.amazonaws.com/public/"
          print("Production media storage is S3-only and uses public/ prefix")
          PY

      - name: Check model migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Bootstrap CMS routes
        run: python manage.py bootstrap_site_pages

      - name: Safely fill empty CMS pages
        run: python manage.py fill_empty_cms_from_snapshots

      - name: Normalize CMS metadata
        run: python manage.py normalize_cms_metadata

      - name: Initialize homepage CMS
        run: python manage.py seed_home_page

      - name: Audit external media migration candidates
        run: python manage.py migrate_external_media

      - name: Audit CMS content
        run: python manage.py audit_existing_cms_content --only-problems
