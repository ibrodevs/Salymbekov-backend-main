name: Backend checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  django-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Django system check
        run: python manage.py check

      - name: Check CMS model migrations
        run: python manage.py makemigrations cms_pages --check --dry-run

      - name: Generate missing proxy migrations for migration-graph validation
        run: |
          python manage.py makemigrations about_pages ait_pages center_pages clinical_pages cooperation_pages home_pages infrastructure_pages it_college_pages mfm_pages postgrad_pages program_pages university_pages --noinput
          for app in about_pages ait_pages center_pages clinical_pages cooperation_pages home_pages infrastructure_pages it_college_pages mfm_pages postgrad_pages program_pages university_pages; do
            if [ -f "$app/migrations/0001_initial.py" ]; then
              echo "===== $app/migrations/0001_initial.py ====="
              cat "$app/migrations/0001_initial.py"
            fi
          done

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Bootstrap CMS routes
        run: python manage.py bootstrap_site_pages

      - name: Safely fill empty CMS pages
        run: python manage.py fill_empty_cms_from_snapshots

      - name: Audit CMS content
        run: python manage.py audit_existing_cms_content --only-problems
